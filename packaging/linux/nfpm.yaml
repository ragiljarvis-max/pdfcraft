# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION, RELEASE and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: pdfcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
# 1 for releases; 1.<label> for a labelled local build (PDFCRAFT_BUILD_LABEL), which sorts after
# the release of the same version and before the next one.
release: ${RELEASE}
section: graphics
priority: optional
maintainer: ${PDFCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://getartcraft.com/apps/pdfcraft
license: MIT OR Apache-2.0
description: |-
  Open-source, native PDF workbench: read, comment, fill and sign forms,
  organize, combine, split, edit, redact, protect and export PDFs.
  Includes pdfcraft-cli, a headless command runner and opt-in MCP server.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries. Printing likewise shells out to CUPS's lpstat/lp (cups-client);
# without it the Print dialog still offers Save as PDF, so it is a recommendation, not a hard
# dependency.
overrides:
  deb:
    depends:
      # 2.31 (Ubuntu 20.04): the release binary is built in an ubuntu:20.04 container, so the
      # package must not demand a newer libc or 20.04 refuses to install it.
      - libc6 (>= 2.31)
      - libgcc-s1
      - libxkbcommon0
      # xkbcommon-dl loads it on X11; without it the app panics on minimal Ubuntu 20.04 installs.
      - libxkbcommon-x11-0
      - libvulkan1 | libegl1
    recommends:
      - cups-client
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE (which has no libxkbcommon, vulkan-loader or libglvnd-egl package). The glibc
    # floor names libm because the binaries' libm symbols (hypot, hypotf) are versioned: RHEL 9's
    # glibc 2.34 provides libc.so.6(GLIBC_2.35) through backports, but not this, so it refuses.
    # 2.31 because the release binary is built in an ubuntu:20.04 container (glibc 2.31).
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.31)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - cups-client
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/pdfcraft
    dst: /usr/bin/pdfcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/pdfcraft-cli
    dst: /usr/bin/pdfcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
